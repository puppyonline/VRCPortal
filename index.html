<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <div class="electron-titlebar">

          <line x1="3" y1="12" x2="21" y2="12"/>

            </svg>
          </div>
          <div>
            <h1>VRChat Portal</h1>
            <p class="subtitle">API Explorer</p>

          </a>
