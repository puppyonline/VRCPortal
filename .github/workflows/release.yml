name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Generate icon from SVG
        run: |
          choco install inkscape -y --no-progress
          inkscape electron/icon.svg --export-type=png --export-filename=electron/icon.png -w 512 -h 512
        shell: cmd

      - run: npx vite build

      - run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe

  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Generate icon from SVG
        run: |
          brew install librsvg
          rsvg-convert electron/icon.svg -w 512 -h 512 -o electron/icon.png

      - run: npx vite build

      - run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            release/*.dmg
            release/*.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
